name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read

jobs:
  ci:
    name: 🚀 All-in-One CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3
          tools: composer:v2

      - name: ⚙️ Setup Application Environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --graceful --ansi

      - name: 🎨 1. Composer Lint (Laravel Pint)
        run: composer lint:check

      - name: 🔍 2. Composer Stan (PHPStan)
        run: composer types:check

      - name: 🛡️ 3. CVE Security Audit (Composer Audit)
        run: composer cve:check

      - name: 🧪 4. Unit & Feature Tests
        run: composer test:unit
