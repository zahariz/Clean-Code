name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Code Style & Formatting (Composer Lint / Laravel Pint)
  # -------------------------------------------------------------
  lint:
    name: 🎨 Composer Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint (Lint Check)
        run: composer lint:check

  # -------------------------------------------------------------
  # Job 2: Static Analysis (Composer Stan / PHPStan / Larastan)
  # -------------------------------------------------------------
  stan:
    name: 🔍 Composer Stan (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (Static Analysis)
        run: composer types:check

  # -------------------------------------------------------------
  # Job 3: CVE Security Vulnerability Check (Composer Audit)
  # -------------------------------------------------------------
  cve-audit:
    name: 🛡️ CVE Security Audit (Composer Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Security Audit (CVE Check)
        run: composer cve:check

  # -------------------------------------------------------------
  # Job 4: Automated Unit & Feature Tests
  # -------------------------------------------------------------
  unit-tests:
    name: 🧪 Unit & Feature Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3
          tools: composer:v2

      - name: Copy .env.example
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Run Migrations
        run: php artisan migrate --graceful --ansi

      - name: Run Unit & Feature Tests
        run: composer test:unit
